(()=>{'use strict';const KEY='gridlife_alpha_1';const $=q=>document.querySelector(q);const fmt=n=>Math.round(n).toLocaleString('ja-JP');const clamp=(a,l,h)=>Math.max(l,Math.min(h,a));const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const defs={garage:{name:'整備工場',icon:'🔧',base:4500,desc:'レースの整備力と毎日の収入が増える',effect:'+整備力 / +売上'},homes:{name:'住宅街',icon:'🏠',base:3200,desc:'人口が増え、街の税収が増える',effect:'+住民 / +税収'},factory:{name:'パーツ工場',icon:'🏭',base:6900,desc:'パーツを毎日自動生産する',effect:'+パーツ / +売上'},cafe:{name:'カフェ',icon:'☕',base:2800,desc:'生活の楽しみと街の売上を作る',effect:'+幸福 / +売上'},office:{name:'物流センター',icon:'📦',base:5800,desc:'配送事業の自動収入を作る',effect:'+売上'},lab:{name:'研究所',icon:'🧪',base:8500,desc:'レースの開発効率を上げる',effect:'+研究力'}};const autoDefs={crew:{name:'ピットクルー雇用',cost:4000,desc:'毎日の車両状態を自動回復する'},deliver:{name:'自動配送ルート',cost:5800,desc:'毎日の事業収入 +¥650'},scout:{name:'パーツ回収ドローン',cost:7000,desc:'毎日パーツ +2'},training:{name:'ドライバー育成AI',cost:9500,desc:'毎日ドライバー経験値 +3'}};const init=()=>({day:1,hour:8,money:9000,energy:85,mood:70,rep:0,driver:1,driverXP:0,car:{engine:1,handling:1,reliability:1,condition:100,damage:{engine:0,suspension:0,brakes:0,body:0}},parts:5,city:{garage:0,homes:0,factory:0,cafe:0,office:0,lab:0},autos:{crew:0,deliver:0,scout:0,training:0},staff:1,people:25,inventory:[],equipped:null,wins:0,races:0,expeditions:0,logs:['街の外れに小さなレースチームを設立した。'],lastRace:null,ledger:[],debt:0,arrears:0,raceSession:null});let s;try{s=Object.assign(init(),JSON.parse(localStorage.getItem(KEY)||'null')||{});s.car={...init().car,...s.car};s.car.damage={...init().car.damage,...(s.car.damage||{})};s.city={...init().city,...s.city};s.autos={...init().autos,...s.autos};s.ledger=Array.isArray(s.ledger)?s.ledger:[];s.raceSession=s.raceSession||null}catch{s=init()}let tab='dashboard',raceAnim=null,toastTimer,cameraMode='overhead',racePositions=[0.05,.035,.02,.01],cameraFrame=0,cameraVelocity=0,cameraLean=0,circuitId='hoshihama',raceReplayEvents=[],raceDnfReplay=false;const circuits={hoshihama:{name:'星浜モーターパーク',tag:'バランス型',length:'3.8km',shape:'oval',engine:1,handling:1,reliability:1,level:0,prize:1,sky:'#142943',desc:'高速区間と中速コーナーが共存する標準コース'},harbor:{name:'港湾ストリート',tag:'高速型',length:'4.6km',shape:'harbor',engine:1.45,handling:.65,reliability:.75,level:3,prize:1.25,sky:'#173752',desc:'長い直線と厳しいブレーキングが特徴'},mountain:{name:'緑峰ヒルサーキット',tag:'技巧型',length:'3.1km',shape:'mountain',engine:.6,handling:1.65,reliability:1.2,level:6,prize:1.4,sky:'#1b3e36',desc:'連続ヘアピンと登り勾配。旋回性能が重要'},endurance:{name:'南岸エンデュランス',tag:'耐久型',length:'5.2km',shape:'endurance',engine:.9,handling:.95,reliability:1.9,level:9,prize:1.65,sky:'#302845',desc:'長距離高速区間と複合コーナー。耐久力が勝負'}};const circuit=()=>circuits[s.raceSession?.circuit||circuitId]||circuits.hoshihama;const circuitPower=()=>{const c=circuit();return power()+(s.car.engine-1)*8*(c.engine-1)+(s.car.handling-1)*8*(c.handling-1)+(s.car.reliability-1)*8*(c.reliability-1)};const circuitPrize=()=>Math.round((2600+s.races*140)*circuit().prize);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}};const entry=(label,amount)=>{s.ledger.unshift({day:s.day,hour:s.hour,label,amount});s.ledger=s.ledger.slice(0,40)};const log=m=>{s.logs.unshift(`DAY ${s.day} ${String(s.hour).padStart(2,'0')}:00  ${m}`);s.logs=s.logs.slice(0,22)};const notice=m=>{let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';e.className='toast';document.body.appendChild(e)}e.textContent=m;clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.remove(),2600)};const can=(time=0,energy=0,money=0)=>s.hour+time<=24&&s.energy>=energy&&s.money>=money;function advance(h){s.hour+=h;if(s.hour>=24){s.hour=24;notice('今日はここまで。休息して翌日へ進もう。')}}function transact(time,energy,money){if(s.hour+time>24)return notice('時間が足りない。翌日へ進もう。'),false;if(s.energy<energy)return notice('体力不足。自宅で休もう。'),false;if(s.money<money)return notice('資金不足。仕事で稼ごう。'),false;s.money-=money;if(money)entry('投資・活動費',-money);s.energy-=energy;advance(time);return true}function nextDay(){

const cost=rent+food+payroll+upkeep+systems+interest;s.money+=income-cost;entry('日次売上',income);entry('家賃',-rent);entry('食費',-food);entry('人件費',-payroll);if(upkeep)entry('施設維持費',-upkeep);if(systems)entry('自動化運営費',-systems);if(interest)entry('借入利息',-interest);
s.parts+=s.city.factory*2+s.autos.scout*2;if(s.autos.crew)s.car.condition=clamp(s.car.condition+s.autos.crew*12,0,100);if(s.autos.training)gainXP(s.autos.training*3);
s.mood=clamp(s.mood+s.city.cafe*2-2-(s.money<0?9:0),0,100);s.energy=100;s.hour=8;s.day++;
if(s.money<0){s.arrears++;s.rep=Math.max(0,s.rep-1);log('資金不足・信用低下')}else s.arrears=0;

function elevationUI(progress=0){const line=document.querySelector('#altitude-line'),fill=document.querySelector('#altitude-fill');if(!line||!fill)return;const vals=Array.from({length:101},(_,i)=>elevationAt(i/100)),min=Math.min(...vals)-10,max=Math.max(...vals)+10,xy=vals.map((v,i)=>[i*5,67-(v-min)/(max-min)*57]);const d=xy.map(([x,y],i)=>(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)).join(' ');line.setAttribute('d',d);fill.setAttribute('d',d+' L500 76 L0 76 Z');const marker=document.querySelector('#altitude-marker');if(marker){marker.setAttribute('x1',String(progress%1*500));marker.setAttribute('x2',String(progress%1*500))}const status=document.querySelector('#live-altitude');if(status)status.textContent='標高 '+Math.round(elevationAt(progress))+'m';const gradient=document.querySelector('#gradient-display');if(gradient)gradient.textContent='最大想定勾配 '+(elevations[s.raceSession?.circuit||circuitId]||elevations.hoshihama).max+'%'}
function terrainBackdrop(g,w,h){const id=s.raceSession?.circuit||circuitId;const mountain=id==='mountain',endurance=id==='endurance',harbor=id==='harbor';const layers=mountain?4:harbor?1:3;for(let layer=0;layer<layers;layer++){const base=h*(.31+layer*.13);g.beginPath();g.moveTo(0,h);for(let x=0;x<=w;x+=12){const ridge=Math.sin(x*.011+layer*1.7)*18+Math.sin(x*.023+layer*.8)*13+(mountain?28:11)*Math.sin(x*.005+layer);g.lineTo(x,base-ridge)}g.lineTo(w,h);g.closePath();g.fillStyle=['#264852','#2b5959','#31594e','#274b43'][layer];g.globalAlpha=.35+layer*.12;g.fill()}g.globalAlpha=1;if(harbor){g.fillStyle='#637980';for(let x=30;x<w;x+=110){g.fillRect(x,h*.45,5,55);g.fillRect(x-15,h*.45,60,5)}}}
function drawRace(positions=[0.05,.035,.02,.01]){
racePositions=positions.slice();elevationUI(positions[0]||0);if(cameraMode!=='overhead'){racePerspective(cameraMode,positions);return}
const canvas=$('#track');if(!canvas)return;const g=canvas.getContext('2d'),w=canvas.width,h=canvas.height,track=getTrack(s.raceSession?.circuit||circuitId);
g.clearRect(0,0,w,h);

drawTracksideMap(g,track);trackStroke(g,track,75,'#384e4e');trackStroke(g,track,65,'#718692');trackStroke(g,track,56,'#1c303e');
g.save();g.setLineDash([8,17]);trackStroke(g,track,2,'#c0ccd1');g.restore();

g.save();g.translate(start.x,start.y);g.rotate(start.angle);for(let i=0;i<8;i++){g.fillStyle=i%2?'#f8fafc':'#17222c';g.fillRect(-8,-23+i*6,16,6)}g.restore();

positions.forEach((p,i)=>{const pos=pointOnTrack(track,p-i*.0015);g.save();g.translate(pos.x,pos.y);g.rotate(pos.angle);g.shadowColor=colors[i];g.shadowBlur=10;g.fillStyle=colors[i];g.beginPath();g.roundRect(-12,-7,24,14,4);g.fill();g.shadowBlur=0;g.fillStyle='#112b3b';g.fillRect(-3,-5,10,10);g.fillStyle='#fff';g.fillRect(8,-4,3,8);g.restore()});
g.fillStyle='#dffff6';g.font='bold 16px system-ui';g.textAlign='left';g.fillText(circuit().name,16,28);g.font='12px system-ui';g.fillStyle='#a8c8d2';g.fillText(circuit().length+' / '+circuit().tag+' / START-FINISH',17,47);
g.fillText('● PLAYER   ● RIVALS',17,h-13);g.textAlign='right';g.fillText('TRACK LAYOUT · TOP VIEW',w-17,h-13);eventOverlay(g,w,h,positions[0]||0)
}
function drawRetirementScene(t,progress){
const canvas=document.querySelector('#track');if(!canvas)return;
const g=canvas.getContext('2d'),w=canvas.width,h=canvas.height;
g.save();
const active=t>=.44&&t<.68;
if(cameraMode==='overhead'){
 const track=getTrack(circuitId),p=pointOnTrack(track,progress);
 g.translate(p.x+28,p.y+24);
 g.fillStyle='#f8bf68';g.fillRect(-19,-9,38,18);g.fillStyle='#132c37';g.fillRect(-7,-6,13,12);
 g.fillStyle='#f7edf0';g.fillRect(-15,6,8,4);g.fillRect(7,6,8,4);
 if(active){g.translate(36*Math.min(1,(t-.44)/.24),15);g.fillStyle='#eac566';g.fillRect(-17,-8,35,15);g.fillStyle='#ffffff';g.font='bold 9px monospace';g.fillText('RESCUE',-17,-12)}
}else{
 if(t<.68){g.fillStyle='#162733';g.fillRect(w*.62,h*.64,140,42);g.fillStyle='#eabf6b';g.fillRect(w*.64,h*.58,104,42);g.fillStyle='#b3def1';g.fillRect(w*.67,h*.6,39,16);
 if(active){g.fillStyle='#f8d56a';g.font='bold 18px monospace';g.fillText('RECOVERY',w*.63,h*.52)}}
}
g.restore();g.fillStyle='#e8f2f3';g.fillRect(0,76,w,33);g.fillStyle='#8f1823';g.fillRect(0,76,w*.16,33);g.font='bold 17px system-ui';g.textAlign='left';g.fillStyle='#172b38';g.fillText(t<.44?'DNF / VEHICLE STOPPED':t<.68?'RED FLAG / VEHICLE RECOVERY':'RACE RESUMED / DNF',w*.18,98);
}
function animateRace(place){
let frameNo=0;const total=300, names=['YOU / #01','HAWK / #12','NOVA / #07','RIFT / #24'];
const playerFinish=1.01-(place-1)*.018;
const endSpeeds=[playerFinish,1.008,.998,.988];
if(place>1){const order=[1,2,3].slice(0,place-1);order.forEach((id,i)=>endSpeeds[id]=playerFinish+.012*(place-i))}
else{endSpeeds[1]=.995;endSpeeds[2]=.986;endSpeeds[3]=.975}
const finishResult=()=>{raceAnim=null;const el=document.querySelector('#pit-alert');if(el)el.textContent=raceDnfReplay?'DNF — 車両回収完了':'FINISH — '+place+'位 / 4台　レース終了';notice(raceDnfReplay?'リタイア：車両回収完了':place+'位でフィニッシュ！')};
function tick(){
const canvas=document.querySelector('#track');if(!canvas){raceAnim=null;return}
frameNo++;const t=Math.min(frameNo/total,1);const lap= Math.min(5,Math.floor(t*5)+1);
const underControl=raceReplayEvents.some(e=>e.type==='safety')&&t>=.40&&t<.59;const neutralTime=underControl?.40:t;const advances=endSpeeds.map((v,i)=>Math.max(0,(raceDnfReplay&&i===0&&t>=.42?.42:neutralTime)*v+(i===0?0:Math.sin(neutralTime*17+i)*.0025)));
drawRace(advances);if(raceDnfReplay&&t>=.42){drawRetirementScene(t,advances[0])}const eventNode=document.querySelector('#race-event-text');if(eventNode){eventNode.textContent=t<.12?'スタート！ 観客が一斉に立ち上がりました':t<.40?'スタンドから声援が送られています':t<.58?'ピットウィンドウ / スポンサー中継':t<.80?'終盤戦！ 観客の熱気が高まっています':'ファイナルラップ / フィニッシュ間近'}
const visibleEvents=raceReplayEvents.filter(e=>e.t<=t);const lastEvent=visibleEvents[visibleEvents.length-1];if(eventNode&&lastEvent)eventNode.textContent=lastEvent.message;const flag=document.querySelector('#race-flag-indicator'),history=document.querySelector('#race-event-history'),overtakes=document.querySelector('#race-overtakes');const red=raceDnfReplay&&t>=.44&&t<.68;const sc=!red&&raceReplayEvents.some(e=>e.type==='safety')&&t>=.40&&t<.59;const yellow=raceReplayEvents.some(e=>e.type==='yellow')&&t>=.23&&t<.40;if(flag){flag.className='race-flag '+(red?'yellow':sc?'safety':yellow?'yellow':'green');flag.textContent=red?'RED FLAG / 競技中断':sc?'SAFETY CAR / 追い越し禁止':yellow?'YELLOW FLAG / 黄旗':'GREEN FLAG / 走行中'}if(history)history.innerHTML=visibleEvents.slice().reverse().map(e=>'<div>'+e.message+'</div>').join('')||'レース進行中';if(overtakes)overtakes.textContent=(underControl||red)?'OVERTAKES PROHIBITED':('OVERTAKES '+(t>=.76?1:0));const ranked=advances.map((v,i)=>({i,v})).sort((a,b)=>b.v-a.v);
const position=raceDnfReplay&&t>=.42?'DNF':ranked.findIndex(v=>v.i===0)+1;
const lapEl=document.querySelector('#hud-lap'),posEl=document.querySelector('#hud-pos'),clockEl=document.querySelector('#hud-clock'),progressEl=document.querySelector('#hud-progress'),board=document.querySelector('#timing-board'),alert=document.querySelector('#pit-alert');
if(lapEl)lapEl.textContent=lap+' / 5';
if(posEl)posEl.textContent=position+' / 4';
if(clockEl){const seconds=t*395;clockEl.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(Math.floor(seconds%60)).padStart(2,'0')+'.'+Math.floor(seconds%1*10)}
if(progressEl)progressEl.style.width=(t*100).toFixed(1)+'%';
if(board)board.innerHTML=ranked.map((r,j)=>'<div class="timing-row '+(r.i===0?'me':'')+'"><b>'+(j+1)+'</b><span>'+names[r.i]+'</span><span>'+((r.v*5).toFixed(2))+' LAP</span><span class="delta">'+(j===0?'LEAD':'+'+((ranked[0].v-r.v)*93).toFixed(1)+'s')+'</span></div>').join('');
if(alert){const pit=t>.46&&t<.61;alert.textContent=pit?'PIT WINDOW — '+(s.lastRace?.includes('ピット：tires')?'タイヤ交換中':s.lastRace?.includes('ピット：repair')?'応急整備中':'ノーピット作戦'):t>=1?'FINISH — '+place+'位 / 4台':lap===5?'FINAL LAP — 最終周回':'RACE LIVE — LAP '+lap+' / 5'}
if(frameNo<total)raceAnim=requestAnimationFrame(tick);else finishResult()
}
raceAnim=requestAnimationFrame(tick)
}

/* GRIDLIFE BATCH INTEGRATION: all new state additive; no save-key change */
s.team={skill:1,contracts:1,sponsor:0,...(s.team||{})};
s.property=Number.isFinite(s.property)?s.property:0;
s.lastTelemetry=Array.isArray(s.lastTelemetry)?s.lastTelemetry:[];
let batchTimer=null;
function stopBatch(){if(batchTimer!==null){clearTimeout(batchTimer);batchTimer=null}}
function batchLive(){return s.raceSession?.live}
function batchInitial(){return {lap:0,tire:100,elapsed:[0,0,0,0],positions:[0,0,0,0],telemetry:[],events:[],rivals:[1,2,3].map(()=>({tire:100,damage:0,pitted:false,retired:false})),paused:true,speed:1,waiting:false,retired:false,pitted:false,flags:'green'}}
if(batchLive()){let v=batchLive();v.rivals=Array.isArray(v.rivals)&&v.rivals.length===3?v.rivals:batchInitial().rivals;v.telemetry=Array.isArray(v.telemetry)?v.telemetry:[];v.paused=true;v.speed=v.speed||1;v.waiting=!!v.waiting}
function batchSchedule(){stopBatch();let v=batchLive();if(!v||v.paused||v.waiting)return;batchTimer=setTimeout(()=>{batchTimer=null;if(batchLive()&&!batchLive().paused){act('batchLap');batchSchedule()}},1400/(v.speed||1))}
function batchTelemetry(items){if(!items||!items.length)return '';const points=(key,scale)=>items.map((p,i)=>(30+i*128)+','+(132-p[key]*scale)).join(' ');return '<section class="panel"><div class="eyebrow">TELEMETRY</div><svg viewBox="0 0 620 145" preserveAspectRatio="none" style="width:100%;height:150px;background:#112535"><polyline fill="none" stroke="#7de4c5" stroke-width="2" points="'+points('time',.8)+'"/><polyline fill="none" stroke="#eec77a" stroke-width="2" points="'+points('tire',1)+'"/><polyline fill="none" stroke="#8eb6ef" stroke-width="2" points="'+points('condition',1)+'"/></svg><p class="muted">緑＝ラップ秒数　黄＝タイヤ残量　青＝車両状態</p>'+items.map(x=>'<div class="log">LAP '+x.lap+' | '+x.time.toFixed(1)+'秒 | タイヤ '+x.tire+'% | 車両 '+x.condition+'%</div>').join('')+'</section>'}
function batchPanel(){let v=batchLive();if(!v)return batchTelemetry(s.lastTelemetry);return '<section class="panel"><div class="eyebrow">LIVE RACE / '+v.lap+' OF 5</div><div class="cols"><div class="metric"><small>タイヤ</small><b>'+v.tire+'%</b></div><div class="metric"><small>車両</small><b>'+s.car.condition+'%</b></div><div class="metric"><small>総合秒数</small><b>'+v.elapsed[0].toFixed(1)+'</b></div></div><div class="actions" style="margin:12px 0"><button class="btn" data-action="batchPause">'+(v.paused?'▶ 再開':'⏸ 停止')+'</button><button class="btn" data-action="batchSpeed">'+v.speed+'倍速</button><button class="btn" data-action="batchLap" '+(v.waiting?'disabled':'')+'>次の周回</button></div><div class="actions"><button class="btn tiny" data-action="batchPace" data-key="safe">安全</button><button class="btn tiny" data-action="batchPace" data-key="balanced">標準</button><button class="btn tiny" data-action="batchPace" data-key="push">プッシュ</button></div><div class="actions" style="margin:8px 0"><button class="btn tiny" data-action="batchPit" data-key="no">無交換</button><button class="btn tiny" data-action="batchPit" data-key="tires">タイヤ交換</button><button class="btn tiny" data-action="batchPit" data-key="repair">ピット修理</button></div><div class="muted">戦略 '+escapeHTML(s.raceSession.pace)+' / '+escapeHTML(s.raceSession.pit)+'</div>'+(v.waiting?'<div class="actions"><button class="btn" data-action="batchIncident" data-key="continue">続行</button><button class="btn" data-action="batchIncident" data-key="repair">緊急修理</button><button class="btn" data-action="batchIncident" data-key="retire">リタイア</button></div>':'')+batchTelemetry(v.telemetry)+'</section>'}
function batchFinish(){let v=batchLive();if(!v)return;stopBatch();let place=v.retired?4:1+v.elapsed.slice(1).filter(t=>t<v.elapsed[0]).length,prize=v.retired?0:Math.round([2600+s.races*140,1200+s.races*65,550+s.races*30,150][place-1]*circuit().prize);s.races++;s.money+=prize;entry('レース賞金',prize);s.rep+=v.retired?0:Math.max(1,5-place);gainXP(4+(5-place)*2);if(place===1&&!v.retired)s.wins++;s.lastTelemetry=v.telemetry;s.lastRace=circuit().name+' / '+(v.retired?'DNF':place+'位')+' / '+v.lap+'周 / 賞金 ¥'+fmt(prize);log(s.lastRace);s.raceSession=null;render();notice(v.retired?'リタイア':place+'位でフィニッシュ')}
function batchLap(){const v=batchLive(),ses=s.raceSession;if(!v||v.lap>=5||v.waiting)return;let lap=++v.lap,pace=ses.pace||'balanced',pit=ses.pit||'no',sc=Math.random()<.1,accident=Math.random()<(pace==='push'?.1:pace==='safe'?.012:.04),failure=Math.random()<.025+Object.values(s.car.damage).reduce((n,x)=>n+x,0)/1500,base=90+raceTarget()*.07;
let t=base+({safe:3,balanced:0,push:-3}[pace])+(100-v.tire)*.12+(100-s.car.condition)*.12-(circuitPower()-100)*.08+rnd(-4,4)+(sc?9:0);
if(pit!=='no'&&(!v.pitted||pit==='repair')&&lap>=2){let p=pit==='tires'?(sc?2:7):(sc?4:10);t+=p;v.pitted=true;if(pit==='tires')v.tire=100;else s.car.condition=clamp(s.car.condition+15,0,100);ses.pit='no';v.events.push('LAP '+lap+' ピット +'+p+'秒')}
if(sc&&pace==='push'){t+=5;v.events.push('LAP '+lap+' 黄旗違反 +5秒')}

v.flags=sc?'yellow':'green';v.elapsed[0]+=t;for(let i=1;i<4;i++){let ai=v.rivals[i-1];if(ai.retired){v.elapsed[i]+=350;continue}let lt=base+rnd(-6,7)+i+(100-ai.tire)*.13+(sc?9:0);if(ai.tire<48&&!ai.pitted){lt+=7;ai.tire=100;ai.pitted=true;v.events.push('ライバル '+i+' ピットイン')}if(Math.random()<.035){lt+=14;ai.damage+=rnd(10,30);if(ai.damage>=65)ai.retired=true;v.events.push('ライバル '+i+' 故障')}ai.tire=clamp(ai.tire-rnd(11,21),0,100);v.elapsed[i]+=lt}v.tire=clamp(v.tire-(pace==='push'?23:pace==='safe'?10:16),0,100);v.positions=v.elapsed.map((x,i)=>lap/5-(x-Math.min(...v.elapsed))*.00008);v.telemetry.push({lap,time:t,tire:v.tire,condition:s.car.condition});v.events.push('LAP '+lap+' / '+t.toFixed(1)+'秒 / タイヤ '+v.tire+'%');log(v.events[v.events.length-1]);if(lap===5||v.retired){batchFinish();return}render()}
const oldBatchAct=act;
act=function(a,k){
 if(a==='raceResolve'&&s.raceSession&&!s.raceSession.live){s.raceSession.live=batchInitial();render();return}
 if(a==='batchPause'){let v=batchLive();if(v){v.paused=!v.paused;batchSchedule();render()}return}
 if(a==='batchSpeed'){let v=batchLive();if(v){v.speed=v.speed===1?2:v.speed===2?4:1;batchSchedule();render()}return}
 if(a==='batchLap'){batchLap();return}
 if(a==='batchPace'){if(batchLive()&&['safe','balanced','push'].includes(k)){s.raceSession.pace=k;render()}return}
 if(a==='batchPit'){if(batchLive()&&['no','tires','repair'].includes(k)){s.raceSession.pit=k;render()}return}
 if(a==='batchIncident'){let v=batchLive();if(!v||!v.waiting)return;v.waiting=false;v.paused=true;if(k==='retire'){v.retired=true;batchFinish();return}if(k==='repair'){v.elapsed[0]+=15;s.car.condition=clamp(s.car.condition+15,0,100);v.events.push('緊急ピット +15秒')}render();return}
 if(a==='teamTrain'){if(transact(2,12,650)){s.team.skill++;log('整備研修完了')}render();return}
 if(a==='teamSponsor'){if(transact(1,5,450)){s.team.sponsor++;log('スポンサー契約獲得')}render();return}
 if(a==='teamHire'){if(transact(1,4,800)){s.team.contracts++;s.staff++;log('スタッフ採用')}render();return}
 if(a==='land'){if(transact(2,10,1200+s.property*700)){s.property++;log('事業用地取得')}render();return}
 if(a==='repairPart'&&k in repairCosts){if(!s.car.damage[k])return;const price=Math.ceil(repairPrice(k)*(.9+.1/s.team.skill)),hours=Math.max(1,3-Math.floor(s.team.skill/2));if(transact(hours,12,price)){s.car.damage[k]=0;s.car.condition=clamp(s.car.condition+8,0,100);log(partNames[k]+' 修理完了')}render();return}
 if(a==='raceDecision'&&batchLive())return;
 return oldBatchAct(a,k)
};
const baseRacePage=pages.race;pages.race=()=>baseRacePage()+batchPanel();
const baseGaragePage=pages.garage;pages.garage=()=>baseGaragePage()+'<section class="panel"><h3>チーム運営</h3><p>整備技能 Lv.'+s.team.skill+' / 契約スタッフ '+s.team.contracts+' / スポンサー '+s.team.sponsor+'</p><div class="actions"><button class="btn" data-action="teamTrain">研修 ¥650</button><button class="btn" data-action="teamHire">採用 ¥800</button><button class="btn" data-action="teamSponsor">営業 ¥450</button></div></section>';
const baseCityPage=pages.city;pages.city=()=>baseCityPage()+'<section class="panel"><h3>不動産・事業用地</h3><p>所有区画 '+s.property+' / 毎日維持費 ¥'+(s.property*20)+'</p><button class="btn" data-action="land">用地購入 ¥'+fmt(1200+s.property*700)+'</button></section>';
const baseDay=nextDay;nextDay=function(){if(batchLive())return notice('レース中');let prev=s.money,teamPay=s.team.contracts*65+s.property*20,sponsorSales=s.team.sponsor*150;baseDay();s.money+=sponsorSales-teamPay;entry('スポンサー収入',sponsorSales);entry('追加労務・土地費',-teamPay);render()};
render();})();
