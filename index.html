<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101726"><title>GRIDLIFE | Racing & City Sim</title><style>
:root{--bg:#0b1019;--panel:#151d2b;--panel2:#1c2737;--line:#304058;--ink:#edf3fa;--muted:#91a4b9;--accent:#69eed0;--gold:#ffc86e;--red:#fa7f8f;--blue:#80baff}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}button{font:inherit;cursor:pointer}button:disabled{opacity:.38;cursor:not-allowed}#app{max-width:1320px;margin:auto;min-height:100dvh;padding:16px 18px 94px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-size:clamp(23px,4vw,34px);font-weight:950;letter-spacing:.04em}.brand b{color:var(--accent)}.sub{font-size:12px;color:var(--muted)}.stats{display:flex;gap:7px;flex-wrap:wrap}.stat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:8px 12px;white-space:nowrap}.stat small{display:block;color:var(--muted);font-size:10px}.stat strong{font-size:15px}.nav{display:flex;gap:7px;overflow:auto;padding:18px 0 15px;scrollbar-width:none}.nav button{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:11px 15px;border-radius:11px;white-space:nowrap}.nav button.active{background:#22473f;border-color:var(--accent);color:var(--accent);font-weight:800}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}.main{min-width:0}.sidebar{min-width:0}.panel{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:18px;margin-bottom:14px;overflow:hidden}.panel h2{font-size:21px;margin:0 0 6px}.panel h3{font-size:16px;margin:0 0 11px}.desc{color:var(--muted);font-size:13px;line-height:1.8;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.tile{background:var(--panel2);border:1px solid var(--line);padding:14px;border-radius:12px}.tile h3{margin:0 0 7px}.tile p{font-size:12px;color:var(--muted);line-height:1.6;min-height:38px}.btn{border:1px solid #3e6059;border-radius:10px;background:#25594f;color:#c5ffee;padding:11px 14px;font-weight:800;min-height:43px}.btn:hover:not(:disabled){filter:brightness(1.18)}.btn.alt{background:#25344b;border-color:#48617c;color:#d8e8fa}.btn.warn{background:#593540;border-color:#925263;color:#ffe2e6}.btn.full{width:100%}.btn.tiny{padding:7px 10px;min-height:33px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.eyebrow{font-size:11px;letter-spacing:.11em;color:var(--accent);font-weight:850}.value{font-size:24px;font-weight:850}.muted{color:var(--muted)}.line{height:1px;background:var(--line);margin:14px 0}.bar{height:9px;background:#0b1220;border-radius:20px;overflow:hidden;margin-top:7px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#48bca7,#90f6c9);border-radius:20px}.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:var(--panel2);border-radius:10px;padding:13px}.metric small{display:block;color:var(--muted);font-size:11px}.metric b{display:block;font-size:21px;margin-top:4px}.log{font-size:12px;color:#c1cddd;line-height:1.6;border-bottom:1px solid #273548;padding:9px 0}.log:last-child{border:0}.good{color:var(--accent)}.bad{color:var(--red)}.gold{color:var(--gold)}.citymap{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0}.plot{aspect-ratio:1;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#1b3540;border:1px solid #3a6170;border-radius:10px;font-size:20px;padding:3px}.plot small{font-size:9px;color:#c7e8e4;text-align:center}.plot.empty{background:#17202d;border:1px dashed #3a4a60}.racebox{background:#101a2a;border:1px solid #344c6b;border-radius:14px;padding:10px;margin-bottom:14px}.racebox canvas{width:100%;display:block;border-radius:10px;max-height:350px}.raceResults{min-height:50px;font-size:13px;line-height:1.6}.tag{display:inline-block;font-size:11px;padding:3px 7px;background:#263b4b;border-radius:5px;color:#c2e5f7}.footer{font-size:11px;color:#778da3;line-height:1.6;margin-top:15px}.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#dafbef;color:#103e34;box-shadow:0 8px 35px #0007;padding:12px 18px;border-radius:10px;font-weight:700;max-width:90%;z-index:9;pointer-events:none}.mobilebar{display:none}@media(max-width:860px){#app{padding:12px 12px 105px}.layout{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sidebar .panel{margin:0}.brand{font-size:25px}.stats{width:100%}.stat{flex:1;text-align:center;padding:7px 5px}.cols{grid-template-columns:repeat(3,minmax(0,1fr))}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#111b29f4;backdrop-filter:blur(10px);padding:9px max(12px,env(safe-area-inset-left)) calc(9px + env(safe-area-inset-bottom));border-top:1px solid var(--line);gap:7px;z-index:7}.mobilebar button{flex:1;border:1px solid #40546b;background:#24384e;color:white;border-radius:10px;padding:11px 2px;font-size:11px}}@media(max-width:480px){.sidebar{display:block}.sidebar .panel{margin-bottom:12px}.panel{padding:14px}.grid{grid-template-columns:1fr 1fr;gap:8px}.tile{padding:11px}.tile h3{font-size:14px}.tile p{font-size:11px}.tile .btn{font-size:11px;padding:9px 5px}.citymap{gap:4px}.plot{font-size:16px}.plot small{font-size:8px}.metric b{font-size:17px}.nav{padding:12px 0}}
</style></head><body><div id="app"></div><script>
(()=>{'use strict';const KEY='gridlife_alpha_1';const $=q=>document.querySelector(q);const fmt=n=>Math.round(n).toLocaleString('ja-JP');const clamp=(a,l,h)=>Math.max(l,Math.min(h,a));const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const defs={garage:{name:'整備工場',icon:'🔧',base:4500,desc:'レースの整備力と毎日の収入が増える',effect:'+整備力 / +売上'},homes:{name:'住宅街',icon:'🏠',base:3200,desc:'人口が増え、街の税収が増える',effect:'+住民 / +税収'},factory:{name:'パーツ工場',icon:'🏭',base:6900,desc:'パーツを毎日自動生産する',effect:'+パーツ / +売上'},cafe:{name:'カフェ',icon:'☕',base:2800,desc:'生活の楽しみと街の売上を作る',effect:'+幸福 / +売上'},office:{name:'物流センター',icon:'📦',base:5800,desc:'配送事業の自動収入を作る',effect:'+売上'},lab:{name:'研究所',icon:'🧪',base:8500,desc:'レースの開発効率を上げる',effect:'+研究力'}};const autoDefs={crew:{name:'ピットクルー雇用',cost:4000,desc:'毎日の車両状態を自動回復する'},deliver:{name:'自動配送ルート',cost:5800,desc:'毎日の事業収入 +¥650'},scout:{name:'パーツ回収ドローン',cost:7000,desc:'毎日パーツ +2'},training:{name:'ドライバー育成AI',cost:9500,desc:'毎日ドライバー経験値 +3'}};const init=()=>({day:1,hour:8,money:9000,energy:85,mood:70,rep:0,driver:1,driverXP:0,car:{engine:1,handling:1,reliability:1,condition:100},parts:5,city:{garage:0,homes:0,factory:0,cafe:0,office:0,lab:0},autos:{crew:0,deliver:0,scout:0,training:0},staff:1,people:25,inventory:[],equipped:null,wins:0,races:0,expeditions:0,logs:['街の外れに小さなレースチームを設立した。'],lastRace:null,ledger:[],debt:0,arrears:0,raceSession:null});let s;try{s=Object.assign(init(),JSON.parse(localStorage.getItem(KEY)||'null')||{});s.car={...init().car,...s.car};s.city={...init().city,...s.city};s.autos={...init().autos,...s.autos};s.ledger=Array.isArray(s.ledger)?s.ledger:[];s.raceSession=s.raceSession||null}catch{s=init()}let tab='dashboard',raceAnim=null,toastTimer;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}};const entry=(label,amount)=>{s.ledger.unshift({day:s.day,hour:s.hour,label,amount});s.ledger=s.ledger.slice(0,40)};const log=m=>{s.logs.unshift(`DAY ${s.day} ${String(s.hour).padStart(2,'0')}:00  ${m}`);s.logs=s.logs.slice(0,22)};const notice=m=>{let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';e.className='toast';document.body.appendChild(e)}e.textContent=m;clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.remove(),2600)};const can=(time=0,energy=0,money=0)=>s.hour+time<=24&&s.energy>=energy&&s.money>=money;function advance(h){s.hour+=h;if(s.hour>=24){s.hour=24;notice('今日はここまで。休息して翌日へ進もう。')}}function transact(time,energy,money){if(s.hour+time>24)return notice('時間が足りない。翌日へ進もう。'),false;if(s.energy<energy)return notice('体力不足。自宅で休もう。'),false;if(s.money<money)return notice('資金不足。仕事で稼ごう。'),false;s.money-=money;if(money)entry('投資・活動費',-money);s.energy-=energy;advance(time);return true}function nextDay(){
if(s.raceSession)return notice('レース中は翌日に進めません');
const income=80+s.city.homes*180+s.city.garage*260+s.city.cafe*160+s.city.factory*340+s.city.office*440+s.city.lab*110+s.autos.deliver*650;
const rent=480,food=360,payroll=170+s.staff*135,upkeep=s.city.garage*110+s.city.homes*85+s.city.factory*220+s.city.cafe*115+s.city.office*180+s.city.lab*350,systems=s.autos.crew*90+s.autos.deliver*110+s.autos.scout*130+s.autos.training*170,interest=Math.ceil(s.debt*.0008);
const cost=rent+food+payroll+upkeep+systems+interest;s.money+=income-cost;entry('日次売上',income);entry('家賃',-rent);entry('食費',-food);entry('人件費',-payroll);if(upkeep)entry('施設維持費',-upkeep);if(systems)entry('自動化運営費',-systems);if(interest)entry('借入利息',-interest);
s.parts+=s.city.factory*2+s.autos.scout*2;if(s.autos.crew)s.car.condition=clamp(s.car.condition+s.autos.crew*12,0,100);if(s.autos.training)gainXP(s.autos.training*3);
s.mood=clamp(s.mood+s.city.cafe*2-2-(s.money<0?9:0),0,100);s.energy=100;s.hour=8;s.day++;
if(s.money<0){s.arrears++;s.rep=Math.max(0,s.rep-1);log('資金不足・信用低下')}else s.arrears=0;
if(s.arrears>=4){let loan=Math.abs(s.money)+1000;s.debt+=loan;s.money+=loan;s.arrears=0;s.rep=Math.max(0,s.rep-3);entry('緊急融資',loan);log('緊急融資。借入金に利息が発生')}
log('日次決算：売上 ¥'+fmt(income)+' / 支出 ¥'+fmt(cost)+' / 損益 ¥'+fmt(income-cost));render();notice('日次決算を処理しました')}
function gainXP(n){s.driverXP+=n;while(s.driverXP>=s.driver*12){s.driverXP-=s.driver*12;s.driver++;log(`ドライバーがレベル ${s.driver} になった！`)}}function power(){return 42+s.car.engine*11+s.car.handling*9+s.car.reliability*4+s.driver*6+s.city.lab*4+(s.inventory.find(i=>i.id===s.equipped)?.stat||0)+s.mood/10+s.car.condition/10}function cityCount(){return Object.values(s.city).reduce((a,b)=>a+b,0)}function raceCost(){return 350+s.races*95}function raceTarget(){return 90+Math.floor(s.wins/2)*18+Math.floor(s.races/5)*9}function itemName(type,rare){return ['中古','強化','高性能','伝説の'][rare]+' '+({motor:'ECU',aero:'エアロキット',tire:'レーシングタイヤ',tool:'整備ツール'}[type])}function cityPrice(key){return Math.round(defs[key].base*(1+s.city[key]*.75))}function render(){save();$('#app').innerHTML=`<header class="top"><div><div class="brand">GRID<b>LIFE</b> <span class="tag">ALPHA 0.2</span></div><div class="sub">レース × 生活 × 都市開発 × ハクスラ × 仕事 × 自動化</div></div><div class="stats"><div class="stat"><small>DAY / 時刻</small><strong>${s.day}日目 / ${s.hour}:00</strong></div><div class="stat"><small>資金</small><strong class="gold">¥${fmt(s.money)}</strong></div><div class="stat"><small>体力 / 気分</small><strong>${s.energy} / ${s.mood}</strong></div><div class="stat"><small>名声</small><strong>${s.rep}</strong></div></div></header><nav class="nav">${[['dashboard','🏠 ホーム'],['finance','💴 会計'],['race','🏁 レース'],['work','💼 仕事'],['city','🏙 街づくり'],['garage','🔧 ガレージ'],['loot','🎒 探索・装備'],['auto','⚙️ 自動化']].map(([k,v])=>`<button data-tab="${k}" class="${tab===k?'active':''}">${v}</button>`).join('')}</nav><div class="layout"><main class="main" id="main">${pages[tab]()}</main><aside class="sidebar"><section class="panel"><div class="eyebrow">LIFE STATUS</div><h3 style="margin-top:10px">ドライバー Lv.${s.driver}</h3><div class="muted" style="font-size:12px">経験値 ${s.driverXP} / ${s.driver*12}</div><div class="bar"><i style="width:${100*s.driverXP/(s.driver*12)}%"></i></div><div class="line"></div><div class="muted" style="font-size:12px">体力 ${s.energy}/100</div><div class="bar"><i style="width:${s.energy}%"></i></div><div class="muted" style="font-size:12px;margin-top:12px">車両状態 ${s.car.condition}/100</div><div class="bar"><i style="width:${s.car.condition}%"></i></div><div class="line"></div><button class="btn full" data-action="sleep">🌙 休息して翌日へ</button></section><section class="panel"><div class="eyebrow">ACTIVITY LOG</div>${s.logs.slice(0,6).map(x=>`<div class="log">${escapeHTML(x)}</div>`).join('')}</section></aside></div><div class="footer">保存はこのブラウザの端末内（localStorage）。データの同期・オンライン対戦は未実装。リセットはホームから。</div><div class="mobilebar"><button data-tab="dashboard">ホーム</button><button data-tab="race">レース</button><button data-tab="work">仕事</button><button data-tab="city">街</button><button data-tab="auto">自動化</button></div>`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action,b.dataset.key));if(tab==='race')drawRace()};const escapeHTML=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const card=(title,desc,button,action,key,disabled=false)=>`<div class="tile"><h3>${title}</h3><p>${desc}</p><button class="btn full" data-action="${action}" ${key?`data-key="${key}"`:''} ${disabled?'disabled':''}>${button}</button></div>`;
const pages={finance:()=>`<section class="panel"><div class="eyebrow">HARDCORE ECONOMY</div><h2>生活と事業の会計</h2><p class="desc">日次で家賃 ¥480・基本食費 ¥360・人件費 ¥${170+s.staff*135}。設備・人材・自動化の維持費、借入利息も計上されます。資金不足が4日継続すると緊急融資が実行されます。</p><div class="cols"><div class="metric"><small>現金</small><b>¥${fmt(s.money)}</b></div><div class="metric"><small>借入金</small><b>¥${fmt(s.debt)}</b></div><div class="metric"><small>赤字継続</small><b>${s.arrears}日</b></div></div><div class="line"></div><h3>入出金の履歴</h3>${s.ledger.length?s.ledger.map(v=>`<div class="log">DAY ${v.day} ${v.hour}:00　${escapeHTML(v.label)} <b class="${v.amount>=0?'good':'bad'}">${v.amount>=0?'+':'−'}¥${fmt(Math.abs(v.amount))}</b></div>`).join(''):'<p class="muted">取引履歴はありません。</p>'}</section>`,dashboard:()=>`<section class="panel"><div class="eyebrow">THE STORY STARTS HERE</div><h2>小さなチームから、街の頂点へ。</h2><p class="desc">昼は仕事で資金を稼ぎ、街を発展させ、夜はチームを強化する。レースで名声を獲得し、探索で拾った装備を活かし、やがて工場と物流を自動化していく。</p><div class="cols"><div class="metric"><small>レース勝利</small><b>${s.wins} / ${s.races}</b></div><div class="metric"><small>街の施設</small><b>${cityCount()}</b></div><div class="metric"><small>車両戦力</small><b>${Math.round(power())}</b></div></div><div class="line"></div><div class="actions"><button class="btn" data-tab="work">まず仕事で稼ぐ →</button><button class="btn alt" data-tab="race">レースに挑む →</button></div></section><section class="panel"><h3>今日の暮らし</h3><div class="grid">${card('🍜 食事と休憩','気分 +16・体力 +12 / 1時間','¥350 / 食事','eat',null,!can(1,0,350))}${card('🎮 趣味の時間','気分 +25・体力 +5 / 2時間','趣味を楽しむ','hobby',null,!can(2,0,0))}${card('🏋️ トレーニング','経験値 +7 / 2時間・体力 -20','訓練する','train',null,!can(2,20,0))}${card('💾 セーブと初期化','進行状況は操作ごとに自動保存','データを初期化','reset')}</div></section>`,race:()=>`<section class="panel"><div class="eyebrow">RACING LEAGUE</div><h2>ナイトサーキット選手権</h2><p class="desc">チームの性能とドライバーの育成が順位に影響する。エントリー時に3時間・体力20を消費。開始後にペースとピット戦略を判断する。</p><div class="cols"><div class="metric"><small>戦力（推定）</small><b>${Math.round(power())}</b></div><div class="metric"><small>ライバル水準</small><b>${raceTarget()}</b></div><div class="metric"><small>優勝報酬</small><b>¥${fmt(2600+s.races*140)}</b></div></div><div class="line"></div><div class="racebox"><canvas id="track" width="800" height="375" aria-label="コースと車両のレースアニメーション"></canvas></div><div class="raceResults" id="raceResult">${s.lastRace?escapeHTML(s.lastRace):'エントリーしてサーキットへ向かおう。'}</div><div class="actions" style="margin-top:12px">${s.raceSession?`<div class="tile" style="width:100%"><h3>${s.raceSession.stage===1?'序盤：走行ペース':'中盤：ピット戦略'}</h3><div class="actions">${(s.raceSession.stage===1?[['safe','安全運転'],['balanced','標準'],['push','攻める']]:[['no','ノーピット'],['tires','タイヤ交換'],['repair','応急修理']]).map(([k,v])=>`<button class="btn tiny" data-action="raceDecision" data-key="${k}">${v}</button>`).join('')}</div></div>`:`<button class="btn" data-action="race" ${!can(3,20,raceCost())?'disabled':''}>🏁 レース開始（¥${fmt(raceCost())}）</button>`}<button class="btn alt" data-tab="garage">車をチューニング</button></div></section>`,work:()=>`<section class="panel"><div class="eyebrow">DAILY WORK</div><h2>日常の仕事とキャリア</h2><p class="desc">行動するとゲーム内の時間と体力が減る。仕事で資金を得て、建設・整備・自動化への投資を回す。</p><div class="grid">${card('🚚 配送アルバイト','2時間 / 体力 -18。確実な収入。','報酬 ¥900','work','delivery',!can(2,18))}${card('🔧 整備士の仕事','3時間 / 体力 -27。パーツも手に入る。','報酬 ¥1,400 + パーツ','work','mechanic',!can(3,27))}${card('💻 フリーランス','4時間 / 体力 -32。名声に応じて高報酬。',`報酬 ¥${fmt(1500+s.rep*35)}`,'work','freelance',!can(4,32))}${card('🏎 テストドライバー','3時間 / 体力 -24。経験値を獲得。','報酬 ¥1,050 + XP','work','test',!can(3,24))}</div></section>`,city:()=>`<section class="panel"><div class="eyebrow">CITY MANAGEMENT</div><h2>街を育てる</h2><p class="desc">街の施設は毎朝の収支やパーツ生産、レース能力に影響する。建設には2時間と体力10が必要。</p><div class="citymap">${Array.from({length:25},(_,i)=>{const keys=Object.keys(defs),built=[];keys.forEach(k=>{for(let n=0;n<s.city[k];n++)built.push(k)});const k=i===12?'center':built[i<12?i:i-1];return k==='center'?'<div class="plot">🏁<small>本部</small></div>':k?`<div class="plot">${defs[k].icon}<small>${defs[k].name}</small></div>`:'<div class="plot empty"><small>空き地</small></div>'}).join('')}</div><div class="grid">${Object.entries(defs).map(([k,d])=>card(`${d.icon} ${d.name} Lv.${s.city[k]}`,`${d.desc}<br><span class="good">${d.effect}</span>`,`建設 ¥${fmt(cityPrice(k))}`,'build',k,!can(2,10,cityPrice(k))||cityCount()>=24)).join('')}</div></section>`,garage:()=>`<section class="panel"><div class="eyebrow">TEAM GARAGE</div><h2>ガレージと開発</h2><p class="desc">部品と現金を使ってマシンの基本性能を上げる。車両状態が落ちるとレース戦力も低下。</p><div class="cols"><div class="metric"><small>エンジン</small><b>Lv.${s.car.engine}</b></div><div class="metric"><small>ハンドリング</small><b>Lv.${s.car.handling}</b></div><div class="metric"><small>信頼性</small><b>Lv.${s.car.reliability}</b></div></div><div class="line"></div><div class="grid">${['engine','handling','reliability'].map(k=>{let d={engine:['⚡ エンジン','加速・最高速'],handling:['🛞 足回り','コーナリング'],reliability:['🛡 信頼性','レース時の安定性']}[k],cost=800+s.car[k]*650,parts=1+s.car[k];return card(d[0],`${d[1]} / パーツ ${parts}個使用`,`強化 ¥${fmt(cost)}`,'upgrade',k,!can(2,12,cost)||s.parts<parts)}).join('')}${card('🔩 マシン整備',`現在 ${s.car.condition}/100。体力 -8 / 1時間。`, '整備 ¥600','repair',null,!can(1,8,600)||s.car.condition>=100)}</div><p class="muted" style="font-size:13px;margin-top:14px">保有パーツ：<b>${s.parts}個</b>　｜　スタッフ：${s.staff}名</p></section>`,loot:()=>`<section class="panel"><div class="eyebrow">SCAVENGE & LOOT</div><h2>パーツ探索・装備収集</h2><p class="desc">廃工場やジャンクヤードを探索し、ランダム性能の装備品を回収する。繰り返し探索して強いアイテムに更新しよう。</p><div class="actions"><button class="btn" data-action="explore" ${!can(3,25,200)?'disabled':''}>🔍 探索する（3時間・¥200）</button><span class="tag">探索回数 ${s.expeditions}</span><span class="tag">所持枠 ${s.inventory.length}/18</span></div><div class="line"></div><h3>装備インベントリ</h3><div class="grid">${s.inventory.length?s.inventory.map(item=>`<div class="tile"><h3>${item.rare===3?'🌟':item.rare===2?'💎':'🔹'} ${escapeHTML(item.name)}</h3><p>チーム戦力 +${item.stat}<br>${s.equipped===item.id?'<span class="good">装備中</span>':'未装備'}</p><div class="actions"><button class="btn tiny" data-action="equip" data-key="${item.id}" ${s.equipped===item.id?'disabled':''}>装備</button><button class="btn alt tiny" data-action="sell" data-key="${item.id}">売却 ¥${item.value}</button></div></div>`).join(''):'<p class="muted">装備なし。まず探索へ。</p>'}</div></section>`,auto:()=>`<section class="panel"><div class="eyebrow">AUTOMATION SYSTEM</div><h2>事業を自動化する</h2><p class="desc">設備・人材・AIに投資することで、毎朝の収益や整備、育成、素材回収を自動化。手作業からチーム経営へ移行する。</p><div class="grid">${Object.entries(autoDefs).map(([k,d])=>card(`⚙️ ${d.name} Lv.${s.autos[k]}`,d.desc,`導入 ¥${fmt(Math.round(d.cost*(1+s.autos[k]*.8)))}`,'automate',k,s.money<Math.round(d.cost*(1+s.autos[k]*.8)))).join('')}</div></section>`};
function act(a,k){
if(a==='race'){if(s.raceSession)return notice('レース進行中');if(!transact(3,20,raceCost()))return;s.raceSession={stage:1,pace:'balanced'};log('レース開始：戦略を選択');render();return}
if(a==='raceDecision'){if(!s.raceSession)return;if(s.raceSession.stage===1){if(!['safe','balanced','push'].includes(k))return;s.raceSession.pace=k;s.raceSession.stage=2;render();return}
if(!['no','tires','repair'].includes(k))return;s.raceSession.pit=k;return act('raceResolve')}
if(a==='sleep')return nextDay();if(a==='reset'){if(confirm('保存した進行状況をすべて消して最初から始めますか？')){s=init();tab='dashboard';render()}return}if(a==='eat'){if(transact(1,0,350)){s.mood=clamp(s.mood+16,0,100);s.energy=clamp(s.energy+12,0,100);log('食事をしてリフレッシュした。')}}if(a==='hobby'){if(transact(2,0,0)){s.mood=clamp(s.mood+25,0,100);s.energy=clamp(s.energy+5,0,100);log('趣味の時間を楽しんだ。')}}if(a==='train'){if(transact(2,20,0)){gainXP(7);log('ドライバーの訓練をした。')}}if(a==='work'){const jobs={delivery:[2,18,900,0,0],mechanic:[3,27,1400,2,0],freelance:[4,32,1500+s.rep*35,0,0],test:[3,24,1050,0,6]};const [h,en,w,parts,xp]=jobs[k];if(transact(h,en,0)){s.money+=w;entry('労働報酬',w);s.parts+=parts;gainXP(xp);s.mood=clamp(s.mood-2,0,100);log(`仕事完了。+¥${fmt(w)}${parts?' / パーツ +'+parts:''}${xp?' / XP +'+xp:''}`);notice('仕事の報酬を受け取った')}}if(a==='build'){let price=cityPrice(k);if(cityCount()>=24)return notice('建設可能な土地がない');if(transact(2,10,price)){s.city[k]++;if(k==='homes')s.people+=18;if(k==='garage')s.staff++;log(`${defs[k].name}が完成した！`);notice('施設を建設した')}}if(a==='upgrade'){const price=800+s.car[k]*650,n=1+s.car[k];if(s.parts<n)return notice('パーツが足りない');if(transact(2,12,price)){s.parts-=n;s.car[k]++;log(`車両の${k}を Lv.${s.car[k]} に強化。`);notice('マシン性能アップ')}}if(a==='repair'){if(transact(1,8,600)){s.car.condition=clamp(s.car.condition+45,0,100);log('車両を整備した。')}}if(a==='automate'){const price=Math.round(autoDefs[k].cost*(1+s.autos[k]*.8));if(transact(0,0,price)){s.autos[k]++;log(`${autoDefs[k].name}を導入。毎朝の処理が強化された。`);notice('自動化を導入した')}}if(a==='explore'){if(s.inventory.length>=18)return notice('装備枠が満杯。売却して空きを作ろう');if(transact(3,25,200)){const rare=Math.random()<.035?3:Math.random()<.16?2:Math.random()<.42?1:0,type=['motor','aero','tire','tool'][rnd(0,3)],item={id:'i'+Date.now()+rnd(0,9999),rare,name:itemName(type,rare),stat:(rare+1)*rnd(3,7)+Math.floor(s.expeditions/6),value:(rare+1)*rnd(200,550)};s.inventory.push(item);s.expeditions++;s.parts+=rnd(0,2);log(`${item.name}（戦力 +${item.stat}）を発見！`);notice('装備を発見した！')}}if(a==='equip'){if(s.inventory.some(i=>i.id===k)){s.equipped=k;log('装備を変更した。')}}if(a==='sell'){const item=s.inventory.find(i=>i.id===k);if(item){s.money+=item.value;entry('部品売却',item.value);s.inventory=s.inventory.filter(i=>i.id!==k);if(s.equipped===k)s.equipped=null;log(`${item.name}を売却した。`)}}if(a==='raceResolve'){if(raceAnim)return;const strategy=s.raceSession||{pace:'balanced',pit:'no'};const bonus={safe:-5,balanced:0,push:12}[strategy.pace]+{no:0,tires:8,repair:-2}[strategy.pit];const risk=strategy.pace==='push'?.22:strategy.pace==='safe'?.02:.07;const failure=Math.random()<risk;const p=power()+bonus-(failure?32:0),target=raceTarget(),variance=rnd(-17,17),opponents=[target+rnd(-8,7),target+rnd(-12,4),target+rnd(-15,10)],player=p+variance;const place=1+opponents.filter(v=>v>player).length;const prize=[2600+s.races*140,1200+s.races*65,550+s.races*30,150][place-1];s.races++;s.money+=prize;entry('レース賞金',prize);s.rep+=Math.max(1,5-place);s.mood=clamp(s.mood+(place===1?13:place===4?-8:5),0,100);s.car.condition=clamp(s.car.condition-rnd(12,23)-(strategy.pace==='push'?12:0)+(strategy.pace==='safe'?5:0)+(strategy.pit==='repair'?18:0)+s.car.reliability,0,100);gainXP(4+(5-place)*2);if(place===1)s.wins++;s.lastRace=`${place}位 / 4台　報酬 ¥${fmt(prize)}。${failure?'機械トラブル発生。':''} ペース：${strategy.pace} / ピット：${strategy.pit}。${place===1?'優勝！チームの名声が高まった。':'開発と練習で順位を上げよう。'}`;log(`レース ${place}位。賞金 ¥${fmt(prize)} を獲得。`);s.raceSession=null;render();animateRace(place);return}render()}
function drawRace(positions=[0.05,.035,.02,.01]){const canvas=$('#track');if(!canvas)return;const ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);ctx.fillStyle='#0d2230';ctx.fillRect(0,0,w,h);ctx.fillStyle='#193d37';ctx.beginPath();ctx.ellipse(400,188,320,147,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#718ca0';ctx.lineWidth=73;ctx.beginPath();ctx.ellipse(400,188,293,119,0,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#253548';ctx.lineWidth=61;ctx.stroke();ctx.strokeStyle='#f8eecf';ctx.setLineDash([12,15]);ctx.lineWidth=2;ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#163329';ctx.font='bold 26px system-ui';ctx.textAlign='center';ctx.fillText('GRIDLIFE CIRCUIT',400,190);ctx.font='15px system-ui';ctx.fillText('NIGHT SERIES',400,215);const colors=['#70f5d2','#f9b76b','#77aaff','#ff7e96'];positions.forEach((v,i)=>{const theta=-Math.PI/2+Math.PI*2*v;const x=400+(293+(i-1.5)*14)*Math.cos(theta),y=188+(119+(i-1.5)*12)*Math.sin(theta);ctx.save();ctx.translate(x,y);ctx.rotate(theta+Math.PI/2);ctx.fillStyle=colors[i];ctx.fillRect(-12,-6,24,12);ctx.fillStyle='#0d1724';ctx.fillRect(2,-4,5,8);ctx.restore()});ctx.fillStyle='#e9f4ff';ctx.textAlign='left';ctx.font='14px system-ui';ctx.fillText('■ PLAYER',16,25)}function animateRace(place){let n=0;raceAnim=requestAnimationFrame(frame);function frame(){n++;const t=Math.min(1,n/135);drawRace([t*(1.04-(place-1)*.032),t*1.02,t*.99,t*.965]);if(n<135)raceAnim=requestAnimationFrame(frame);else{raceAnim=null;notice(`${place}位でフィニッシュ！`)}}}render();})();
</script></body></html>
